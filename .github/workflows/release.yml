name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    name: build the zip
    steps:
      - uses: actions/checkout@v4
      - name: Check the runtime
        run: python -c "import sys; sys.exit(0 if sys.version_info >= (3,9) else 1)"
      - name: Build
        run: python -m compileall -q domingo.py tools tests
      - name: Assemble the bundle
        run: |
          set -eu
          name="Domingo-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp domingo.py LICENSE README.md THIRD-PARTY-NOTICES.md run.sh run.command run.cmd "dist/$name/"
          cp -r static "dist/$name/static"
          cp domingo.example.json "dist/$name/"
          python -c "import pathlib,shutil; shutil.make_archive('dist/'+pathlib.Path('$name').name, 'zip', 'dist', '$name')"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*.zip

  container:
    runs-on: ubuntu-latest
    name: build and publish the image
    needs: bundle
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    runs-on: ubuntu-latest
    name: open the release
    needs: [bundle, container]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - name: Release notes
        run: |
          {
            echo "Domingo ${{ github.ref_name }}."
            echo
            echo "Download \`Domingo-${{ github.ref_name }}.zip\`, put it in a folder, and follow the"
            echo "install steps in the README. The container image is"
            echo "\`ghcr.io/${{ github.repository }}:${{ github.ref_name }}\`."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*.zip
          fail_on_unmatched_files: true
